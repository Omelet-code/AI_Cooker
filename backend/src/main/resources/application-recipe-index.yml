spring:
  config:
    activate:
      on-profile: recipe-index

cooker:
  retrieval:
    index:
      # 显式命令必须再次开启开关，防止仅激活 profile 就产生收费调用。
      enabled: ${COOKER_RETRIEVAL_INDEX_ENABLED:false}
      batch-size: ${COOKER_RETRIEVAL_INDEX_BATCH_SIZE:10}
      max-step-chunk-steps: ${COOKER_RETRIEVAL_INDEX_MAX_STEP_CHUNK_STEPS:4}
      max-chunk-characters: ${COOKER_RETRIEVAL_INDEX_MAX_CHUNK_CHARACTERS:4000}
      document-template-version: ${COOKER_RETRIEVAL_INDEX_DOCUMENT_TEMPLATE_VERSION:1}
      embedding-model: ${COOKER_RETRIEVAL_EMBEDDING_MODEL:text-embedding-v4}
      embedding-dimension: ${COOKER_RETRIEVAL_EMBEDDING_DIMENSION:1024}
      # 可按百炼地域和业务空间覆盖；不得把 API Key 放入 URL。
      endpoint: ${COOKER_RETRIEVAL_DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
      api-key: ${DASHSCOPE_API_KEY:}
