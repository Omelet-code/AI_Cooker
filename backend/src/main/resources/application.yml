spring:
  application:
    name: cooker-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cooker}
    username: ${DB_USERNAME:cooker}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# 菜谱快照必须由 recipe-import profile 显式触发；此处不提供数据集路径默认值，
# 避免普通应用启动意外读取开发机文件系统。
cooker:
  identity:
    jwt-secret: ${COOKER_JWT_SECRET:}
    llm-credential:
      master-key: ${LLM_CREDENTIAL_MASTER_KEY:}
    issuer: cooker
    audience: cooker-web
    access-minutes: ${COOKER_ACCESS_MINUTES:15}
    session-hours: ${COOKER_SESSION_HOURS:24}
    remember-days: ${COOKER_REMEMBER_DAYS:30}
    secure-cookie: ${COOKER_SECURE_COOKIE:true}
  retrieval:
    index:
      document-template-version: ${COOKER_RETRIEVAL_INDEX_DOCUMENT_TEMPLATE_VERSION:1}
      embedding-model: ${COOKER_RETRIEVAL_EMBEDDING_MODEL:text-embedding-v4}
      embedding-dimension: ${COOKER_RETRIEVAL_EMBEDDING_DIMENSION:1024}
      endpoint: ${COOKER_RETRIEVAL_DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
      api-key: ${DASHSCOPE_API_KEY:}
  recipe-import:
    enabled: false
    source-version: ${COOKER_RECIPE_IMPORT_SOURCE_VERSION:1.6.0-a0b14bd}

